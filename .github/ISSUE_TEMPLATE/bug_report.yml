name: Bug report
description: Report a problem with TikTelemetry
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TikTelemetry version
      description: Image tag or commit SHA.
    validations:
      required: true

  - type: input
    id: routeros
    attributes:
      label: RouterOS version and board
      description: e.g. "7.21.5 on RB4011" or "CHR 7.21".
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Host platform / architecture
      description: e.g. "arm/v7 on RB3011", "arm64 Raspberry Pi", "amd64 VM".

  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Relevant environment variables (REDACT secrets and tokens).
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant agent log output (JSON). Redact secrets.
      render: shell
