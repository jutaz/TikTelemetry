name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal test)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules are tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy; run 'go mod tidy'"
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./test/e2e/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  docs:
    name: Doc references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Validate every #sym: reference in the Markdown docs against the actual
      # code, so a renamed or removed Go symbol fails CI instead of silently
      # rotting the documentation. See https://symtether.dev.
      - name: Verify doc symbol references
        run: npx --yes symtether@latest check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Test with race detector and coverage
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm
            goarm: "7"
          - goarch: arm64
          - goarch: amd64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build static binary (${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/tiktelemetry

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  e2e:
    name: End-to-end (RouterOS CHR)
    runs-on: ubuntu-latest
    # E2E boots a real CHR under QEMU and is slower; keep it off PRs from forks
    # where Docker/KVM behavior is less predictable.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run end-to-end tests
        # testcontainers-go manages the RouterOS container lifecycle. The suite
        # waits for the API login to succeed before asserting.
        run: go test -tags e2e -count=1 -timeout 20m -v ./test/e2e/...
