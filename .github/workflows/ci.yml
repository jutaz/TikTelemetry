name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l cmd internal test)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify modules are tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "go.mod / go.sum are not tidy; run 'go mod tidy'"
            git --no-pager diff go.mod go.sum
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags e2e ./test/e2e/...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin a golangci-lint v2 built with Go 1.25+; older builds refuse to
          # analyze code whose go.mod targets a newer Go than the linter's own
          # Go version than the linter's own
          # toolchain ("the Go language version ... is lower than the targeted
          # Go version"). The config in .golangci.yml is v2 format, which needs
          # action v8+ + golangci-lint v2.
          version: v2.5.0

  docs:
    name: Doc references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      # Validate every #sym: reference in the Markdown docs against the actual
      # code, so a renamed or removed Go symbol fails CI instead of silently
      # rotting the documentation. See https://symtether.dev.
      - name: Verify doc symbol references (--strict)
        # --strict also flags refs whose target's implementation changed
        # (tracked in symtether.sum), so prose can be reviewed before it drifts.
        run: npx --yes symtether@latest check --strict

      # Fail if symtether.sum is out of date: a stamped symbol's content changed
      # but the sum was not re-generated (run `npx symtether update` locally,
      # review the affected docs, and commit the updated symtether.sum).
      - name: Verify symtether.sum is current
        run: npx --yes symtether@latest update --check

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true

      - name: Test with race detector and coverage
        run: go test ./... -count=1 -race -covermode=atomic -coverprofile=coverage.out

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  build:
    name: Cross-compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: arm
            goarm: "7"
          - goarch: arm64
          - goarch: amd64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true

      - name: Build static binary (${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }})
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -ldflags="-s -w" -o /dev/null ./cmd/tiktelemetry

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  e2e:
    name: End-to-end (RouterOS CHR)
    runs-on: ubuntu-latest
    # E2E boots a real MikroTik CHR under QEMU on the runner and drives the
    # full agent against it. Reliability comes from two things:
    #   1. The harness bypasses the image's slow IDE/tap entrypoint and boots
    #      QEMU directly with a virtio disk + virtio-net over SLIRP, which is
    #      2-4x faster on slow nested-KVM CPU SKUs (see harness_test.go's
    #      qemuBootScript for the full rationale).
    #   2. KVM acceleration below turns the multi-minute TCG boot into ~30-45s.
    #      GitHub's standard Linux runners expose /dev/kvm via nested
    #      virtualization; the udev rule makes it usable without a
    #      group/session dance.
    # Skip on fork PRs where Docker/KVM behavior is less predictable.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.12"
          cache: true

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify KVM is available
        # CHR under pure TCG emulation can take 5+ minutes to boot and flakes
        # the wait budget. Fail loudly here if /dev/kvm is missing so the
        # cause is obvious, rather than letting the suite time out later.
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm is not present on this runner; CHR boot would run under slow TCG emulation."
            exit 1
          fi
          ls -l /dev/kvm
          echo "KVM acceleration is available."
          echo "Runner CPU:"
          grep -m1 'model name' /proc/cpuinfo || true
          nproc

      - name: Run end-to-end tests
        # testcontainers-go manages the RouterOS container lifecycle. The suite
        # waits for the API login to succeed before asserting.
        run: go test -tags e2e -count=1 -timeout 20m -v ./test/e2e/...
