name: Release

# Driven by GitHub Releases. Publishing a Release (in the UI, or with
# `gh release create vX.Y.Z --generate-notes`) creates the git tag AND fires
# this workflow, which builds and pushes the multi-arch image to GHCR and
# attaches the per-architecture offline tarballs to that same Release.
#
# The git tag is the version — Go reads it natively (go install / the module
# proxy), and the binary reports it via runtime/debug build info. We stamp it
# into the image build too via the VERSION build-arg.
#
# workflow_dispatch is a manual fallback to (re)build the artifacts for an
# existing Release, e.g. if a build failed and you want to retry without
# recreating the Release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write # attach assets to the Release
  packages: write # push to GHCR

jobs:
  # Resolve the release tag from whichever event fired, and check out that tag
  # so the build matches the released commit exactly.
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        name: Determine tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_TAG}"
          case "$tag" in
            v*) ;;
            *) echo "::error::release tag must start with 'v' (got '$tag')"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  image:
    name: Build & push multi-arch image
    runs-on: ubuntu-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Do not tag `latest` for pre-releases (v0.1.0-rc1 etc.).
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          # arm/v6, not arm/v7: the arm binary is built GOARM=6 for MikroTik
          # compatibility (GOARM=7's VFPv3 float ops SIGILL on several MikroTik
          # ARM SoCs). Labelling the manifest arm/v6 keeps it truthful; armv6
          # also runs on armv7 hosts. See the Dockerfile.
          #
          # The ARMv5 EN7562CT boards (hEX Refresh, hEX S 2025) are handled by
          # a SEPARATE -armv5 tag below, not a v5 entry here: RouterOS ignores
          # the OCI variant field and would grab this arm (=v6) blob, which
          # SIGILLs on ARMv5. A distinct tag is the only way those users can
          # select the right image.
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Docker metadata (armv5)
        id: meta-armv5
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          # Suffix every tag with -armv5 so this never collides with or
          # overwrites the main multi-arch manifest (e.g. v0.1.0-armv5,
          # 0.1-armv5, latest-armv5). No bare `latest`.
          flavor: |
            latest=false
            suffix=-armv5,onlatest=true
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and push (armv5, EN7562CT / hEX Refresh & hEX S 2025)
        uses: docker/build-push-action@v7
        with:
          context: .
          # linux/arm/v5 -> the Dockerfile maps TARGETVARIANT=v5 to GOARM=5,
          # the only variant that runs on the FPU-less ARMv5 EN7562CT SoC.
          platforms: linux/arm/v5
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.tag }}
          tags: ${{ steps.meta-armv5.outputs.tags }}
          labels: ${{ steps.meta-armv5.outputs.labels }}

  tarballs:
    name: Offline image tarballs
    runs-on: ubuntu-latest
    needs: prepare
    # Per-architecture `docker save` tarballs for offline RouterOS import
    # (/container/add file=...), which avoids all registry authentication.
    strategy:
      matrix:
        include:
          # arm/v6 (GOARM=6): the vast majority of MikroTik 32-bit ARM boards
          # (they have an FPU). Named "arm" to match the short arch label.
          - arch: arm
            platform: linux/arm/v6
          # arm/v5 (GOARM=5, soft float): ONLY the FPU-less EN7562CT boards
          # (hEX Refresh, hEX S 2025). A separate tarball because RouterOS
          # ignores the OCI variant field, so those users import this file
          # explicitly. NOTE: MIPS boards (mipsbe/mmips/smips, e.g. the older
          # hEX S RB760iGS) cannot run containers at all — monitor them
          # off-router via the API. There is deliberately no MIPS tarball.
          - arch: armv5
            platform: linux/arm/v5
          - arch: arm64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build single-arch image and save as tar
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --build-arg VERSION="$TAG" \
            -t tiktelemetry:${{ matrix.arch }} --load .
          docker save tiktelemetry:${{ matrix.arch }} \
            -o "tiktelemetry-$TAG-${{ matrix.arch }}.tar"
          gzip -9 "tiktelemetry-$TAG-${{ matrix.arch }}.tar"

      - name: Attach tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: tiktelemetry-${{ needs.prepare.outputs.tag }}-${{ matrix.arch }}.tar.gz
          fail_on_unmatched_files: true
