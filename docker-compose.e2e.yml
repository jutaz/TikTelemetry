# docker-compose.e2e.yml
#
# Spins up a real MikroTik RouterOS (Cloud Hosted Router) under QEMU for
# end-to-end testing. Use this when you want to run the e2e suite against a
# long-lived router instead of letting testcontainers manage the lifecycle.
#
#   docker compose -f docker-compose.e2e.yml up -d
#   ROUTEROS_ADDR=127.0.0.1:8728 go test -tags e2e -count=1 ./test/e2e/...
#   docker compose -f docker-compose.e2e.yml down
#
# Default credentials are admin with a blank password.
#
# This mirrors the testcontainers harness (test/e2e/harness_test.go): it
# bypasses the image's own entrypoint and boots QEMU directly with a
# paravirtualised virtio disk + virtio-net NIC over plain SLIRP user
# networking, forwarding the binary API on 8728. Virtio boots the guest 2-4x
# faster than the image's default emulated IDE disk on slow hosts, and pure
# SLIRP removes the need for a second interface / NET_ADMIN / /dev/net/tun.
services:
  routeros:
    image: evilfreelancer/docker-routeros:7
    restart: unless-stopped
    # Hardware acceleration: uncomment on Linux hosts that expose /dev/kvm to
    # map it INTO the container (the host merely having it is not enough). The
    # entrypoint below auto-detects it and falls back to TCG when absent, so
    # leave this commented on macOS/Windows Docker Desktop (which have no
    # /dev/kvm) — boot is just slower there.
    # devices:
    #   - /dev/kvm
    ports:
      - "8728:8728" # RouterOS binary API
    entrypoint:
      - sh
      - -c
      - |
        set -e
        # The :7 tag pins RouterOS 7.21.5, so the disk path is fixed. (The Go
        # harness derives this from the image's $ROUTEROS_IMAGE env var, but
        # compose eats both variable and command interpolation in this block,
        # so it is named literally here.)
        img="/routeros_source/chr-7.21.5.vdi"
        accel=""
        cpu="qemu64"
        if [ -w /dev/kvm ]; then
          accel="-enable-kvm"
          cpu="host,kvm=on"
          echo "tiktelemetry-e2e: KVM available, enabling hardware acceleration"
        else
          echo "tiktelemetry-e2e: KVM unavailable, using TCG (slow)"
        fi
        exec qemu-system-x86_64 \
          -display none -serial mon:stdio \
          $${accel} -cpu "$${cpu}" -m 512 -smp 2 \
          -drive file="$${img}",format=vdi,if=virtio \
          -netdev user,id=net0,hostfwd=tcp::8728-:8728 \
          -device virtio-net-pci,netdev=net0
