# docker-compose.e2e.yml
#
# Spins up a real MikroTik RouterOS (Cloud Hosted Router) under QEMU for
# end-to-end testing. Use this when you want to run the e2e suite against a
# long-lived router instead of letting testcontainers manage the lifecycle.
#
#   docker compose -f docker-compose.e2e.yml up -d
#   ROUTEROS_ADDR=127.0.0.1:8728 go test -tags e2e -count=1 ./test/e2e/...
#   docker compose -f docker-compose.e2e.yml down
#
# Default credentials are admin with a blank password. The binary API is
# enabled by default on CHR and forwarded on 8728.
#
# Two networks are required: with a second interface (eth1) present, the image's
# entrypoint enables QEMU host port forwarding on eth0 so the API is reachable
# from the host. With a single network the API port is not forwarded.
services:
  routeros:
    image: evilfreelancer/docker-routeros:7
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
      # Hardware acceleration: QEMU only uses KVM if /dev/kvm is mapped INTO
      # the container (the host merely having it is not enough). With it the
      # CHR boots in ~30-60s; without it QEMU falls back to slow TCG emulation
      # and boot takes 5+ minutes. Comment this line out on hosts that do not
      # expose /dev/kvm (e.g. macOS/Windows Docker Desktop) — boot will just be
      # slower.
      - /dev/kvm
    ports:
      - "8728:8728" # RouterOS binary API
      - "8729:8729" # RouterOS API-SSL
    networks:
      - default
      - routeros_net

networks:
  routeros_net:
    driver: bridge
