version: "3.8"

# TikTelemetry — lightweight multi-exporter telemetry agent for MikroTik RouterOS
# --------------------------------------------------------------------------------
# Select one or more backends via the EXPORTERS env var (see .env.example).
# Data is collected once per scrape and fanned out to every enabled exporter.
#
# Quick start:
#   1. Copy .env.example to .env and fill in your credentials
#   2. cp docker-compose.example.yml docker-compose.yml
#   3. docker compose up -d
# (or run this file directly: docker compose -f docker-compose.example.yml up -d)
#
# Can also run directly inside RouterOS v7 container feature on arm/arm64
# boards; point ROUTER_ADDRESS at the host bridge interface (advanced).

services:
  tiktelemetry:
    # Pre-built image from GitHub Container Registry
    image: ghcr.io/jutaz/tiktelemetry:latest

    # Or build from source locally:
    # build: .

    container_name: tiktelemetry
    restart: unless-stopped

    env_file: .env

    environment:
      # Soft memory ceiling (recommended for constrained devices)
      GOMEMLIMIT: ${GOMEMLIMIT:-24MiB}

    mem_limit: 64m

    # RouterOS API port (plain-text). Listen is on the router, not the
    # container — included for clarity.
    expose:
      - 8728
      - 8729
